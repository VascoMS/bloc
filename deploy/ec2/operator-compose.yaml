services:
  mempool-il:
    image: ${MEMPOOL_IMAGE:?set MEMPOOL_IMAGE to an immutable digest}
    restart: unless-stopped
    command: ["-source", "encrypted-corpus", "-encrypted-corpus", "/corpus/encrypted-corpus.json", "-listen", ":8080", "-max-items", "128"]
    volumes:
      - /etc/bloc/encrypted-corpus.json:/corpus/encrypted-corpus.json:ro

  bloc-node:
    image: ${BLOC_IMAGE:?set BLOC_IMAGE to an immutable digest}
    restart: unless-stopped
    depends_on:
      - mempool-il
    environment:
      NODE_ID: ${NODE_ID:?set NODE_ID for this EC2 operator}
    command: ["run", "--config", "/config/cluster.json", "--secrets", "/run/secrets/operator.json"]
    volumes:
      - /etc/bloc/cluster.json:/config/cluster.json:ro
      - /etc/bloc/cluster.crs:/config/cluster.ec2.crs:ro
      - /etc/bloc/operator.json:/run/secrets/operator.json:ro
    ports:
      - "8000:8000"
      - "9000:9000"

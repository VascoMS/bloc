[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bloc-latency-charts"
version = "0.1.0"
description = "Static latency charts for BLOC eval-suite results"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.9",
  "pandas>=2.2",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
bloc-latency-charts = "bloc_latency_charts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

apiVersion: v1
kind: ConfigMap
metadata:
  name: bloc-grafana-dashboard
  namespace: bloc
  labels:
    grafana_dashboard: "1"
data:
  bloc-sidecar.json: |
    {
      "uid": "bloc-sidecar",
      "title": "BLOC Sidecar Distributed Visibility",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "5s",
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Completed slots",
          "targets": [{ "expr": "sum(bloc_slot_completed_total)", "refId": "A" }],
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 }
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "p50/p95 total slot latency",
          "targets": [
            { "expr": "histogram_quantile(0.50, sum by (le) (rate(bloc_slot_stage_duration_seconds_bucket{stage=\"total\"}[5m]))) * 1000", "legendFormat": "p50 ms", "refId": "A" },
            { "expr": "histogram_quantile(0.95, sum by (le) (rate(bloc_slot_stage_duration_seconds_bucket{stage=\"total\"}[5m]))) * 1000", "legendFormat": "p95 ms", "refId": "B" }
          ],
          "gridPos": { "h": 8, "w": 12, "x": 6, "y": 0 }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Per-stage latency",
          "targets": [{ "expr": "histogram_quantile(0.95, sum by (le, stage) (rate(bloc_slot_stage_duration_seconds_bucket{stage!=\"total\"}[5m]))) * 1000", "legendFormat": "{{stage}} p95 ms", "refId": "A" }],
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Protocol messages and bytes",
          "targets": [
            { "expr": "rate(bloc_protocol_messages_total[1m])", "legendFormat": "{{node_id}} {{direction}} {{kind}} msg/s", "refId": "A" },
            { "expr": "rate(bloc_protocol_message_bytes_total[1m])", "legendFormat": "{{node_id}} {{direction}} {{kind}} B/s", "refId": "B" }
          ],
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "HTTP request rate and latency",
          "targets": [
            { "expr": "sum by (handler, code) (rate(bloc_http_requests_total[1m]))", "legendFormat": "{{handler}} {{code}} req/s", "refId": "A" },
            { "expr": "histogram_quantile(0.95, sum by (le, handler) (rate(bloc_http_request_duration_seconds_bucket[5m]))) * 1000", "legendFormat": "{{handler}} p95 ms", "refId": "B" }
          ],
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Current slot phase",
          "targets": [{ "expr": "bloc_slot_phase", "legendFormat": "{{node_id}} {{phase}}", "refId": "A" }],
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Selected transactions and gas",
          "targets": [
            { "expr": "bloc_slot_selected_transactions", "legendFormat": "{{node_id}} txs", "refId": "A" },
            { "expr": "bloc_slot_selected_gas", "legendFormat": "{{node_id}} gas", "refId": "B" }
          ],
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 24 }
        }
      ]
    }

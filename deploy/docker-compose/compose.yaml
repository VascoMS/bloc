x-bloc-node: &bloc-node
  image: ${BLOC_IMAGE:?set BLOC_IMAGE to an immutable bloc-node digest}
  restart: unless-stopped
  command: ["run", "--config", "/config/cluster.json", "--secrets", "/run/secrets/operator.json"]
  volumes:
    - ${BLOC_CLUSTER_CONFIG:?set BLOC_CLUSTER_CONFIG}:/config/cluster.json:ro
    - ${BLOC_CLUSTER_CRS:?set BLOC_CLUSTER_CRS}:/config/cluster.crs:ro

services:
  mempool-il:
    image: ${MEMPOOL_IMAGE:?set MEMPOOL_IMAGE to an immutable mempool-il digest}
    restart: unless-stopped
    command:
      - -source
      - encrypted-corpus
      - -encrypted-corpus
      - /corpus/encrypted-corpus.json
      - -listen
      - :8080
      - -max-items
      - "512"
    volumes:
      - ${BLOC_ENCRYPTED_CORPUS:?set BLOC_ENCRYPTED_CORPUS}:/corpus/encrypted-corpus.json:ro
    ports:
      - "18080:8080"

  bloc-node-0:
    <<: *bloc-node
    environment:
      NODE_ID: "0"
    volumes:
      - ${BLOC_CLUSTER_CONFIG:?set BLOC_CLUSTER_CONFIG}:/config/cluster.json:ro
      - ${BLOC_CLUSTER_CRS:?set BLOC_CLUSTER_CRS}:/config/cluster.crs:ro
      - ${BLOC_SECRET_0:?set BLOC_SECRET_0}:/run/secrets/operator.json:ro
    ports:
      - "18000:8000"

  bloc-node-1:
    <<: *bloc-node
    environment:
      NODE_ID: "1"
    volumes:
      - ${BLOC_CLUSTER_CONFIG:?set BLOC_CLUSTER_CONFIG}:/config/cluster.json:ro
      - ${BLOC_CLUSTER_CRS:?set BLOC_CLUSTER_CRS}:/config/cluster.crs:ro
      - ${BLOC_SECRET_1:?set BLOC_SECRET_1}:/run/secrets/operator.json:ro
    ports:
      - "18001:8001"

  bloc-node-2:
    <<: *bloc-node
    environment:
      NODE_ID: "2"
    volumes:
      - ${BLOC_CLUSTER_CONFIG:?set BLOC_CLUSTER_CONFIG}:/config/cluster.json:ro
      - ${BLOC_CLUSTER_CRS:?set BLOC_CLUSTER_CRS}:/config/cluster.crs:ro
      - ${BLOC_SECRET_2:?set BLOC_SECRET_2}:/run/secrets/operator.json:ro
    ports:
      - "18002:8002"

  bloc-node-3:
    <<: *bloc-node
    environment:
      NODE_ID: "3"
    volumes:
      - ${BLOC_CLUSTER_CONFIG:?set BLOC_CLUSTER_CONFIG}:/config/cluster.json:ro
      - ${BLOC_CLUSTER_CRS:?set BLOC_CLUSTER_CRS}:/config/cluster.crs:ro
      - ${BLOC_SECRET_3:?set BLOC_SECRET_3}:/run/secrets/operator.json:ro
    ports:
      - "18003:8003"

  prometheus:
    image: prom/prometheus:v3.5.0
    depends_on:
      - bloc-node-0
      - bloc-node-1
      - bloc-node-2
      - bloc-node-3
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "19090:9090"

  grafana:
    image: grafana/grafana:12.1.0
    depends_on:
      - prometheus
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: bloc
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "13000:3000"
